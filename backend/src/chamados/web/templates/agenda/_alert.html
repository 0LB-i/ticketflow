{#- O aviso da agenda no menu (side_nav), perguntado a cada minuto: os compromissos que começam
    em até 15 minutos. O app.js põe o número no título da aba. -#}
<span id="aviso-agenda" hx-get="/agenda/aviso" hx-trigger="every 60s" hx-swap="outerHTML" data-avisos="{{ count }}" class="ml-auto">
  {%- if count %}
  <span class="inline-flex h-5 min-w-5 items-center justify-center rounded-full bg-danger px-1.5 text-xs font-semibold text-on-danger tabular-nums">{{ count }}<span class="sr-only"> {{ t("agenda.avisos", n=count) }}</span></span>
  {%- endif %}
</span>
