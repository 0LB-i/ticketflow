# Ambiente de desenvolvimento.
# Uso: docker compose up -d
services:
  db:
    image: postgres:17   # para testar no 16: postgres:16
    environment:
      POSTGRES_DB: chamados
      POSTGRES_USER: chamados
      POSTGRES_PASSWORD: chamados   # apenas desenvolvimento
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chamados -d chamados"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:                          # captura e-mails enviados em dev: http://localhost:8025
    image: axllent/mailpit:v1.20
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  pgdata:
